spring.application.name=student-attendance

# Jenkins usually runs on 8080, so the app uses 8081
server.port=8081

# File-based H2 database (no separate DB server needed). Ansible overrides the path on deploy.
spring.datasource.url=jdbc:h2:file:./data/attendance-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health + build info, used by Ansible and the Jenkins smoke test
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.build.enabled=true
management.info.env.enabled=true
info.app.name=Online Student Attendance System
info.app.build-number=${app.build-number}
info.app.environment=${app.environment}

# App settings
attendance.low-threshold=75
app.seed-demo-data=true
app.build-number=local
app.environment=development
