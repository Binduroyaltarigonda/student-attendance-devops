# Where Ansible deploys the application.
#
# "local"   = the same machine that runs Jenkins (your Mac). No SSH needed.
# "servers" = remote Linux machines (Ubuntu/Debian/RHEL VM, AWS EC2, etc.) reached over SSH.
#             The app runs there as a systemd service.

[local]
localhost ansible_connection=local ansible_python_interpreter=auto_silent

[servers]
# Uncomment and edit to deploy to a Linux server:
# web1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[servers:vars]
ansible_become=true
app_home=/opt/student-attendance
app_user=attendance
create_app_user=true
install_java=true
app_env=production
